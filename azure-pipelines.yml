trigger:
- main

pool:
  name: Default

variables:
- group: dbt_lina
- name: DEV_SOURCE_DB
  value: 'gold_tempo'
- name: PROD_TARGET_DB
  value: 'gold_copy'
- name: SHARED_BACKUP_FILE
  value: '\\BLC-FILE01\SqlBackups\gold_tempo_dev_to_gold_copy_prod.bak'

stages:
# =========================
# BUILD
# =========================
- stage: Build
  displayName: 'Build Database (gold_tempo)'
  jobs:
  - job: Build
    steps:
    - checkout: self
      clean: true

    # Build (keep VSBuild since your working example uses .sln)
    - task: VSBuild@1
      displayName: 'Visual Studio Build'
      inputs:
        solution: '**\gold_tempo.sln'
        vsVersion: '17.0'

    # Publish the dacpac
    - task: CopyFiles@2
      displayName: 'Copy into artifacts folder'
      inputs:
        SourceFolder: '$(Build.Repository.LocalPath)\gold_tempo\bin\Debug'
        Contents: '**/*.dacpac'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# =========================
# DEPLOY DEV (gold_tempo)
# =========================
- stage: Deploy_DEV
  displayName: 'Deploy DEV gold_tempo'
  dependsOn: Build
  jobs:
  - job: DeployDEV
    steps:
    - download: current
      artifact: drop

    - task: SqlDacpacDeploymentOnMachineGroup@0
      displayName: 'Deploy DACPAC to DEV gold_tempo'
      inputs:
        TaskType: 'dacpac'
        DacpacFile: '$(Pipeline.Workspace)\drop\gold_tempo.dacpac'
        TargetMethod: 'server'
        ServerName: 'BLC-SVR-DW-DEV'
        DatabaseName: 'gold_tempo'
        AuthScheme: 'sqlServerAuthentication'
        SqlUsername: '$(sqluser)'
        SqlPassword: '$(sqlpass)'
        PublishProfile: '$(Build.Repository.LocalPath)\gold_tempo\gold_tempo.publish.xml'

# =========================
# FULL DATA COPY: DEV -> PROD
# gold_tempo (DEV) -> gold_copy (PROD)
# =========================
- stage: Copy_DEV_to_PROD
  displayName: 'Full copy DEV gold_tempo -> PROD gold_copy'
  dependsOn: Deploy_DEV
  jobs:
  - job: CopyDevToProd
    steps:
    # ---- BACKUP on DEV server (writes to shared path) ----
    - powershell: |
        $server = "BLC-SVR-DW-DEV"
        $user   = "$(sqluser)"
        $pass   = "$(sqlpass)"
        $srcDb  = "$(DEV_SOURCE_DB)"
        $bak    = "$(SHARED_BACKUP_FILE)"

        $tsql = @"
        BACKUP DATABASE [$srcDb]
          TO DISK = N'$bak'
          WITH COPY_ONLY, INIT, COMPRESSION, STATS = 10;
        "@

        $tsql | sqlcmd -S $server -U $user -P $pass -b -l 300 -d master
      displayName: 'DEV: Backup gold_tempo to shared .bak'

    # ---- RESTORE on PROD server into gold_copy (reads from shared path) ----
    - powershell: |
        $server = "BLC-SVR-DW-PROD"
        $user   = "$(sqluser)"
        $pass   = "$(sqlpass)"
        $dstDb  = "$(PROD_TARGET_DB)"
        $bak    = "$(SHARED_BACKUP_FILE)"

        $tsql = @"
        IF DB_ID(N'$dstDb') IS NOT NULL
        BEGIN
          ALTER DATABASE [$dstDb] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;
        END

        RESTORE DATABASE [$dstDb]
          FROM DISK = N'$bak'
          WITH REPLACE, RECOVERY, STATS = 10;

        ALTER DATABASE [$dstDb] SET MULTI_USER;
        "@

        $tsql | sqlcmd -S $server -U $user -P $pass -b -l 600 -d master
      displayName: 'PROD: Restore into gold_copy'
