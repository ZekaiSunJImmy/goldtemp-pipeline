trigger:
  branches:
    include:
    - main

pool:
  name: Default

variables:
  # Source DB (DEV) and destination DB (PROD)
  DEV_SOURCE_DB_NAME: 'gold_tempo'
  PROD_TARGET_DB_NAME: 'gold_copy'

  # IMPORTANT:
  # This path must be reachable by BOTH SQL Servers (DEV and PROD), because:
  # 1) DEV will BACKUP to this path
  # 2) PROD will RESTORE from this same path
  #
  # Best practice: a shared UNC path like \\fileserver\sqlbackups\...
  # (SQL Server service accounts on both sides must have read/write permissions)
  SHARED_BACKUP_FILE: '\\fileserver\sqlbackups\gold_tempo_dev_to_gold_copy_prod.bak'

stages:
# =========================
# BUILD (DACPAC)
# =========================
- stage: Build
  displayName: Build DACPAC
  jobs:
  - job: Build
    displayName: Build
    steps:
    - checkout: self
      persistCredentials: true
      clean: true

    # Optional: confirm sqlproj exists (helps avoid "Solution not found" errors)
    - powershell: |
        Write-Host "Build.SourcesDirectory = $(Build.SourcesDirectory)"
        $projs = Get-ChildItem -Path "$(Build.SourcesDirectory)" -Recurse -Filter *.sqlproj
        if (-not $projs) { throw "No .sqlproj found under $(Build.SourcesDirectory)" }
        $projs | ForEach-Object { $_.FullName }
      displayName: "Find sqlproj"

    - task: MSBuild@1
      displayName: Build SSDT sqlproj
      inputs:
        solution: '**/*.sqlproj'
        msbuildArchitecture: 'x64'
        configuration: 'Debug'

    - task: CopyFiles@2
      displayName: Copy dacpac to staging
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: '**/*.dacpac'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: Publish artifact
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# =========================
# DEPLOY DEV (optional)
# Keep if you still want to deploy schema changes to DEV.
# =========================
- stage: Deploy_DEV
  displayName: Deploy to DEV
  dependsOn: Build
  variables:
  - group: Dev-Group
  jobs:
  - job: DeployDEV
    steps:
    - download: current
      artifact: drop

    - task: SqlDacpacDeploymentOnMachineGroup@0
      displayName: Deploy DACPAC to DEV
      inputs:
        TaskType: 'dacpac'
        DacpacFile: '$(Pipeline.Workspace)/drop/**/gold_tempo.dacpac'
        TargetMethod: 'server'
        ServerName: '$(DEV_SQL_SERVER)'
        DatabaseName: '$(DEV_DB_NAME)'
        AuthScheme: 'sqlServerAuthentication'
        SqlUsername: '$(DEV_DB_USER)'
        SqlPassword: '$(DEV_DB_PASSWORD)'

# =========================
# COPY DEV -> PROD (FULL DATA COPY)
# gold_tempo (DEV) -> gold_copy (PROD)
# =========================
- stage: Copy_DEV_to_PROD
  displayName: Full copy DEV gold_tempo -> PROD gold_copy
  dependsOn: Deploy_DEV   # change to "Build" if you want copy even when Deploy_DEV is removed
  jobs:
  - job: CopyDevToProd
    displayName: Backup on DEV, Restore on PROD
    steps:
    # --- BACKUP on DEV server ---
    - powershell: |
        $server = "$(DEV_SQL_SERVER)"
        $user   = "$(DEV_DB_USER)"
        $pass   = "$(DEV_DB_PASSWORD)"

        $srcDb  = "$(DEV_SOURCE_DB_NAME)"
        $bak    = "$(SHARED_BACKUP_FILE)"

        $tsql = @"
        BACKUP DATABASE [$srcDb]
          TO DISK = N'$bak'
          WITH COPY_ONLY, INIT, COMPRESSION, STATS = 10;
        "@

        $tsql | sqlcmd -S $server -U $user -P $pass -b -l 120 -d master
      displayName: "DEV: Backup gold_tempo to shared .bak"

    # --- RESTORE on PROD server into gold_copy ---
    - powershell: |
        $server = "$(PROD_SQL_SERVER)"
        $user   = "$(PROD_DB_USER)"
        $pass   = "$(PROD_DB_PASSWORD)"

        $dstDb  = "$(PROD_TARGET_DB_NAME)"
        $bak    = "$(SHARED_BACKUP_FILE)"

        $tsql = @"
        IF DB_ID(N'$dstDb') IS NOT NULL
        BEGIN
          ALTER DATABASE [$dstDb] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;
        END

        RESTORE DATABASE [$dstDb]
          FROM DISK = N'$bak'
          WITH REPLACE, RECOVERY, STATS = 10;

        ALTER DATABASE [$dstDb] SET MULTI_USER;
        "@

        $tsql | sqlcmd -S $server -U $user -P $pass -b -l 300 -d master
      displayName: "PROD: Restore shared .bak into gold_copy"

# =========================
# (Optional) Deploy PROD schema after data copy
# If you DON'T want DACPAC to touch PROD, remove this stage entirely.
# =========================
- stage: Deploy_PROD
  displayName: Deploy to PROD
  dependsOn: Copy_DEV_to_PROD
  variables:
  - group: Prod_Group
  jobs:
  - job: DeployPROD
    steps:
    - download: current
      artifact: drop

    - task: SqlDacpacDeploymentOnMachineGroup@0
      displayName: Deploy DACPAC to PROD
      inputs:
        TaskType: 'dacpac'
        DacpacFile: '$(Pipeline.Workspace)/drop/**/gold_tempo.dacpac'
        TargetMethod: 'server'
        ServerName: '$(PROD_SQL_SERVER)'
        DatabaseName: '$(PROD_DB_NAME)'
        AuthScheme: 'sqlServerAuthentication'
        SqlUsername: '$(PROD_DB_USER)'
        SqlPassword: '$(PROD_DB_PASSWORD)'
