trigger:
- main
- vscode

pool:
  name: Default

variables:
- group: Prod_Group

stages:
# =========================
# BUILD
# =========================
- stage: Build
  displayName: 'Build DACPAC'
  jobs:
  - job: Build
    displayName: Build
    steps:
    - checkout: self
      clean: true

    # Show what is actually in the repo on the agent (helps avoid "not found")
    - powershell: |
        Write-Host "Build.SourcesDirectory = $(Build.SourcesDirectory)"
        Write-Host "Top-level items:"
        Get-ChildItem -Path "$(Build.SourcesDirectory)" -Force | Format-Table Name

        Write-Host "`nSearching for .sqlproj / .sln:"
        $matches = Get-ChildItem -Path "$(Build.SourcesDirectory)" -Recurse -Force |
          Where-Object { $_.Name -match '\.sqlproj$|\.sln$' }

        if (-not $matches) {
          throw "No .sqlproj or .sln found under $(Build.SourcesDirectory). Check branch/repo."
        }

        $matches | ForEach-Object { $_.FullName }
      displayName: "List repo + find sqlproj/sln"

    # Build any sqlproj found (works even if you don't have a .sln)
    - task: MSBuild@1
      displayName: 'Build SSDT sqlproj'
      inputs:
        solution: '**/*.sqlproj'
        msbuildArchitecture: 'x64'
        configuration: 'Debug'

    - task: CopyFiles@2
      displayName: 'Copy dacpac to artifacts'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: '**/*.dacpac'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# =========================
# DEPLOY DEV
# =========================
- stage: Deploy_DEV
  displayName: 'Deploy DEV gold_tempo'
  dependsOn: Build
  jobs:
  - job: DeployDEV
    displayName: DeployDEV
    steps:
    - download: current
      artifact: drop

    - task: SqlDacpacDeploymentOnMachineGroup@0
      displayName: 'Deploy DACPAC to DEV (Windows Auth)'
      inputs:
        TaskType: 'dacpac'
        DacpacFile: '$(Pipeline.Workspace)\drop\**\*.dacpac'
        TargetMethod: 'server'
        ServerName: 'BLC-SVR-DW-DEV'
        DatabaseName: 'gold_tempo'
        AuthScheme: 'windowsAuthentication'

# =========================
# FULL DATA COPY: DEV -> PROD
# DEV gold_tempo -> PROD gold_copy
# =========================
- stage: Copy_DEV_to_PROD
  displayName: 'Full copy DEV gold_tempo -> PROD gold_copy'
  dependsOn: Deploy_DEV
  jobs:
  - job: CopyDevToProd
    displayName: CopyDevToProd
    steps:
    - powershell: |
        $devServer  = "BLC-SVR-DW-DEV"
        $prodServer = "BLC-SVR-SQL01"

        $srcDb = "gold_tempo"
        $dstDb = "gold_copy"

        # Shared UNC path accessible by BOTH SQL Servers
        $bak = "\\BLC-FILE01\SqlBackups\gold_tempo_dev_to_gold_copy_prod.bak"

        $backupSql = @"
        BACKUP DATABASE [$srcDb]
          TO DISK = N'$bak'
          WITH COPY_ONLY, INIT, COMPRESSION, STATS = 10;
        "@

        $restoreSql = @"
        IF DB_ID(N'$dstDb') IS NOT NULL
        BEGIN
          ALTER DATABASE [$dstDb] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;
        END

        RESTORE DATABASE [$dstDb]
          FROM DISK = N'$bak'
          WITH REPLACE, RECOVERY, STATS = 10;

        ALTER DATABASE [$dstDb] SET MULTI_USER;
        "@

        # Windows Authentication (agent runs as BALCAN\zsun) via -E
        $backupSql  | sqlcmd -S $devServer  -E -b -l 600  -d master
        $restoreSql | sqlcmd -S $prodServer -E -b -l 1200 -d master
      displayName: 'Backup on DEV, restore to PROD (Windows Auth)'
