trigger:
- main

pool:
  name: Default

# Use the existing Library variable group that already has the right access
variables:
- group: Prod_Group

stages:
# =========================
# BUILD
# =========================
- stage: Build
  displayName: 'Build Database (gold_tempo)'
  jobs:
  - job: Build
    steps:
    - checkout: self
      clean: true

    - task: VSBuild@1
      displayName: 'Visual Studio Build'
      inputs:
        solution: '**\gold_tempo.sln'
        vsVersion: '17.0'

    - task: CopyFiles@2
      displayName: 'Copy dacpac to artifacts'
      inputs:
        SourceFolder: '$(Build.Repository.LocalPath)\gold_tempo\bin\Debug'
        Contents: '**/*.dacpac'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# =========================
# DEPLOY DEV (Windows Auth: BALCAN\zsun via agent identity)
# =========================
- stage: Deploy_DEV
  displayName: 'Deploy DEV gold_tempo'
  dependsOn: Build
  jobs:
  - job: DeployDEV
    steps:
    - download: current
      artifact: drop

    - task: SqlDacpacDeploymentOnMachineGroup@0
      displayName: 'Deploy DACPAC to DEV (Windows Auth)'
      inputs:
        TaskType: 'dacpac'
        DacpacFile: '$(Pipeline.Workspace)\drop\gold_tempo.dacpac'
        TargetMethod: 'server'
        ServerName: 'BLC-SVR-DW-DEV'
        DatabaseName: 'gold_tempo'
        AuthScheme: 'windowsAuthentication'
        PublishProfile: '$(Build.Repository.LocalPath)\gold_tempo\gold_tempo.publish.xml'

# =========================
# FULL DATA COPY: DEV -> PROD
# DEV gold_tempo -> PROD gold_copy
# =========================
- stage: Copy_DEV_to_PROD
  displayName: 'Full copy DEV gold_tempo -> PROD gold_copy'
  dependsOn: Deploy_DEV
  jobs:
  - job: CopyDevToProd
    steps:
    - powershell: |
        $devServer  = "BLC-SVR-DW-DEV"
        $prodServer = "BLC-SVR-DW-PROD"

        $srcDb = "gold_tempo"
        $dstDb = "gold_copy"

        # Shared UNC path accessible by BOTH SQL Servers
        $bak = "\\BLC-FILE01\SqlBackups\gold_tempo_dev_to_gold_copy_prod.bak"

        $backupSql = @"
        BACKUP DATABASE [$srcDb]
          TO DISK = N'$bak'
          WITH COPY_ONLY, INIT, COMPRESSION, STATS = 10;
        "@

        $restoreSql = @"
        IF DB_ID(N'$dstDb') IS NOT NULL
        BEGIN
          ALTER DATABASE [$dstDb] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;
        END

        RESTORE DATABASE [$dstDb]
          FROM DISK = N'$bak'
          WITH REPLACE, RECOVERY, STATS = 10;

        ALTER DATABASE [$dstDb] SET MULTI_USER;
        "@

        # Windows Authentication (agent runs as BALCAN\zsun) via -E
        $backupSql  | sqlcmd -S $devServer  -E -b -l 600 -d master
        $restoreSql | sqlcmd -S $prodServer -E -b -l 1200 -d master
      displayName: 'Backup on DEV, restore to PROD (Windows Auth)'
